<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/style.css">
    <script src="src/js/tema.js"></script>
    <script src="src/js/script.js" defer></script>
    <script src="src/js/perfil.js" defer></script>
    <title>Perfil | BGVerso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/css/perfil.css">
    <link rel="stylesheet" href="src/css/mobile.css">
</head>
<body>
    <header class="header">
        <a class="logo" href="index.html">
            <img src="src/img/logo.webp" alt="">
        </a>

        <nav class="menu">
            <ul class="menu-links">
                <li><a href="index.html">Produtos</a></li>
                <li><a href="pedidos.html">Pedidos</a></li>
                <li><a href="carrinho.html">Carrinho<span class="contador-carrinho" hidden>0</span></a></li>
                <li><a href="perfil.html" aria-current="page">Perfil</a></li>
            </ul>

            <button class="btn-menu" type="button" aria-label="Abrir menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>

        <button class="btn-destaque" type="button">
            <h1>*</h1>
        </button>
    </header>

    <nav>
        <div id="div-nav-up">
            <h1>PERFIL</h1>
        </div>
        <div id="div-nav-down">
            <ul>
                <li><input type="search" id="pesquisa" name="pesquisa" placeholder="PESQUISE :" aria-label="Pesquisar nesta página" autocomplete="off"></li>
                <li><a href="#dados">Dados</a></li>
                <li><a href="#enderecos">Endereços salvos</a></li>
                <li><a href="#cartoes">Cartões</a></li>
                <li><a href="#seguranca">Segurança</a></li>
                <li><a href="#login">Login/Logout</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <div class="categoria compacta" id="dados">
            <h1>Dados</h1>
            <div class="conteudo-categoria">
                <div class="cartao cartao-dados">
                    <div class="grade-campos">
                        <div>
                            <label for="nome">Nome:</label>
                            <input type="text" id="nome" name="nome" maxlength="50">
                        </div>
                        <div>
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email" autocomplete="email" maxlength="100">
                        </div>
                        <div>
                            <label for="sobrenome">Sobrenome:</label>
                            <input type="text" id="sobrenome" name="sobrenome" maxlength="80">
                        </div>
                        <div>
                            <label for="telefone">Telefone:</label>
                            <input type="tel" id="telefone" name="telefone" inputmode="tel" autocomplete="tel" maxlength="15" placeholder="(00) 00000-0000">
                        </div>
                        <div>
                            <label for="cpf">CPF:</label>
                            <input type="text" id="cpf" name="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00">
                        </div>
                        <div>
                            <label for="whatsapp">WhatsApp:</label>
                            <input type="tel" id="whatsapp" name="whatsapp" inputmode="tel" autocomplete="tel" maxlength="15" placeholder="(00) 00000-0000">
                        </div>
                    </div>
                    <div class="avatar-bloco">
                        <button class="avatar" id="btn-avatar" type="button" aria-label="Adicionar foto de perfil">
                            <img id="avatar-imagem" alt="Foto de perfil" hidden>
                            <span class="avatar-placeholder" id="avatar-placeholder" aria-hidden="true">+</span>
                        </button>
                        <input type="file" id="avatar-input" accept="image/*" hidden>
                        <button class="btn secundario" id="btn-remover-avatar" type="button" hidden>Remover foto</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="categoria compacta" id="enderecos">
            <div class="conteudo-categoria">
                <div class="cabecalho-enderecos">
                    <h1>Endereços</h1>
                    <button class="btn-adicionar" id="btn-adicionar-endereco" type="button" aria-label="Adicionar endereço">+</button>
                </div>
                <div id="lista-enderecos"></div>
            </div>
        </div>

        <div class="categoria compacta" id="cartoes">
            <h1>Cartões</h1>
            <div class="conteudo-categoria">
                <div class="cartao coluna">
                    <div id="lista-cartoes"></div>
                </div>
                <form class="cartao coluna" id="form-cartao" novalidate>
                    <h3>Cadastrar cartão</h3>
                    <div class="grade-campos">
                        <div class="campo-form">
                            <label for="cartao-numero">Número do cartão:</label>
                            <input type="text" id="cartao-numero" name="cartao-numero" inputmode="numeric" autocomplete="cc-number" maxlength="19" placeholder="0000 0000 0000 0000" required>
                            <span class="erro" id="erro-cartao-numero" role="alert"></span>
                        </div>
                        <div class="campo-form">
                            <label for="cartao-titular">Nome no cartão:</label>
                            <input type="text" id="cartao-titular" name="cartao-titular" autocomplete="cc-name" placeholder="NOME COMO ESTÁ NO CARTÃO" required>
                            <span class="erro" id="erro-cartao-titular" role="alert"></span>
                        </div>
                        <div class="campo-form">
                            <label for="cartao-validade">Validade:</label>
                            <input type="text" id="cartao-validade" name="cartao-validade" inputmode="numeric" autocomplete="cc-exp" maxlength="5" placeholder="MM/AA" required>
                            <span class="erro" id="erro-cartao-validade" role="alert"></span>
                        </div>
                        <div class="campo-form">
                            <label for="cartao-cvv">CVV:</label>
                            <input type="text" id="cartao-cvv" name="cartao-cvv" inputmode="numeric" autocomplete="cc-csc" maxlength="4" placeholder="000" required>
                            <span class="erro" id="erro-cartao-cvv" role="alert"></span>
                        </div>
                    </div>
                    <div class="acoes-form">
                        <button class="btn" type="submit">Salvar cartão</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="categoria compacta" id="seguranca">
            <h1>Segurança</h1>
            <div class="conteudo-categoria">
                <div class="cartao coluna">
                    <label for="senha-atual">Senha atual:</label>
                    <input type="password" id="senha-atual" name="senha-atual" autocomplete="current-password">
                    <label for="nova-senha">Nova senha:</label>
                    <input type="password" id="nova-senha" name="nova-senha" autocomplete="new-password">
                </div>
            </div>
        </div>

        <div class="categoria compacta" id="login">
            <h1>Login/Logout</h1>
            <div class="conteudo-categoria">
                <div class="cartao coluna" id="painel-conta-logada" hidden>
                    <p>Você está conectado como <strong id="conta-nome"></strong>.</p>
                    <button class="btn" id="btn-sair" type="button">Sair da conta</button>
                </div>

                <form class="cartao coluna" id="form-entrar" novalidate>
                    <h3>Entrar</h3>
                    <div class="campo-form">
                        <label for="entrar-email">E-mail:</label>
                        <input type="email" id="entrar-email" name="entrar-email" autocomplete="email" maxlength="100" required>
                    </div>
                    <div class="campo-form">
                        <label for="entrar-senha">Senha:</label>
                        <input type="password" id="entrar-senha" name="entrar-senha" autocomplete="current-password" required>
                    </div>
                    <div class="acoes-form">
                        <button class="btn" type="submit">Entrar</button>
                    </div>
                    <p class="erro" id="erro-entrar" role="alert"></p>
                </form>

                <form class="cartao coluna" id="form-cadastro" novalidate>
                    <h3>Criar conta</h3>
                    <div class="grade-campos">
                        <div class="campo-form">
                            <label for="cadastro-nome">Nome:</label>
                            <input type="text" id="cadastro-nome" name="cadastro-nome" maxlength="50" required>
                        </div>
                        <div class="campo-form">
                            <label for="cadastro-sobrenome">Sobrenome:</label>
                            <input type="text" id="cadastro-sobrenome" name="cadastro-sobrenome" maxlength="80" required>
                        </div>
                        <div class="campo-form">
                            <label for="cadastro-email">E-mail:</label>
                            <input type="email" id="cadastro-email" name="cadastro-email" autocomplete="email" maxlength="100" required>
                        </div>
                        <div class="campo-form">
                            <label for="cadastro-cpf">CPF:</label>
                            <input type="text" id="cadastro-cpf" name="cadastro-cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" required>
                        </div>
                        <div class="campo-form">
                            <label for="cadastro-telefone">Telefone:</label>
                            <input type="tel" id="cadastro-telefone" name="cadastro-telefone" inputmode="tel" autocomplete="tel" maxlength="15" placeholder="(00) 00000-0000" required>
                        </div>
                        <div class="campo-form">
                            <label for="cadastro-senha">Senha (mín. 6 caracteres):</label>
                            <input type="password" id="cadastro-senha" name="cadastro-senha" autocomplete="new-password" minlength="6" required>
                        </div>
                    </div>
                    <div class="acoes-form">
                        <button class="btn" type="submit">Criar conta</button>
                    </div>
                    <p class="erro" id="erro-cadastro" role="alert"></p>
                </form>
            </div>
        </div>
    </main>

    <script src="src/js/perfil-mascaras.js"></script>
    <script src="src/js/conta.js" defer></script>
</body>
</html>
